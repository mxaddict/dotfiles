# Developer Mode lets git create symlinks without admin rights, which the
# .gitconfig's `core.symlinks = true` needs on Windows. Checks first, so only a
# machine that has it off gets the one UAC prompt; fails if it is still off
# afterwards (the prompt declined). Run by the developer-mode hooks in
# .krypt.toml on `krypt setup` and `krypt update`.
[[command]]
group       = "system"
name        = "devmode"
description = "Turn on Windows Developer Mode (asks for elevation only if it is off)"
platform    = "windows"
steps = [
    { run = ["pwsh", "-NoProfile", "-Command", '''$ErrorActionPreference = 'Stop'; $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'; $name = 'AllowDevelopmentWithoutDevLicense'; function Test-DevMode {{ (Get-ItemProperty $key -ErrorAction Ignore).$name -eq 1 }}; if (Test-DevMode) {{ exit 0 }}; Start-Process reg -Verb RunAs -Wait -WindowStyle Hidden -ArgumentList 'add', ($key -replace ':', ''), '/v', $name, '/t', 'REG_DWORD', '/d', '1', '/f'; if (-not (Test-DevMode)) {{ throw 'Developer Mode is still off' }}'''] },
]

# Windows' own OpenSSH Server: installed, started on boot, and logging in to
# scoop's pwsh. The shell is set by its versioned dir, not `current`: sshd
# refuses a junction a non-admin made ("untrusted mount point", seen on Windows
# 11 with scoop's junctions), so after a pwsh update the path differs and the
# next run repoints it. The firewall rule is the one the install creates, left
# as Windows makes it.
#
# Keys come from ~/.ssh/authorized_keys, kept by hand on each machine and never
# in this repo. sshd reads that file itself, except for a member of
# Administrators: then only administrators_authorized_keys, and only while
# Administrators and SYSTEM alone can access it. For such an account the file
# is copied there with that ACL. Membership is read from `whoami /groups`,
# which lists the group by SID even while UAC holds it as deny-only.
#
# Like devmode, it checks without elevation and asks for one UAC prompt only
# when something is off. The copy cannot be read unelevated, so it counts as
# current when its size and timestamp match the source's (Copy-Item keeps the
# timestamp). The script is inline because `krypt setup` runs its hooks before
# anything is linked into ~/.local/bin. Run by the openssh-server hooks in
# .krypt.toml on `krypt setup` and `krypt update`.
[[command]]
group       = "system"
name        = "sshd"
description = "Install and configure OpenSSH Server (asks for elevation only if something is off)"
platform    = "windows"
steps = [
    { run = ["pwsh", "-NoProfile", "-Command", '''
$ErrorActionPreference = 'Stop'
$pwshDir = scoop prefix pwsh
$target = (Get-Item -LiteralPath $pwshDir).Target
if ($target) {{ $pwshDir = $target }}
$shell = Join-Path $pwshDir 'pwsh.exe'
if (-not (Test-Path -LiteralPath $shell)) {{ throw "pwsh is not at $shell; run krypt deps" }}
$keys = Join-Path $HOME '.ssh\authorized_keys'
$adminKeys = Join-Path $env:ProgramData 'ssh\administrators_authorized_keys'
$syncKeys = (Test-Path -LiteralPath $keys) -and (whoami /groups /fo csv /nh | Select-String -SimpleMatch '"S-1-5-32-544"')

function Get-Drift {{
    $sshd = Get-Service sshd -ErrorAction Ignore
    if (-not $sshd) {{ 'sshd is not installed' }}
    elseif ($sshd.StartType -ne 'Automatic' -or $sshd.Status -ne 'Running') {{ "sshd is $($sshd.Status), $($sshd.StartType)" }}
    if ((Get-ItemProperty HKLM:\SOFTWARE\OpenSSH -ErrorAction Ignore).DefaultShell -ne $shell) {{ "the login shell is not $shell" }}
    if ($syncKeys) {{
        $src = Get-Item -LiteralPath $keys
        $dst = Get-Item -LiteralPath $adminKeys -Force -ErrorAction Ignore
        if (-not $dst -or $dst.Length -ne $src.Length -or $dst.LastWriteTimeUtc -ne $src.LastWriteTimeUtc) {{ "$adminKeys differs from $keys" }}
    }}
}}

$drift = @(Get-Drift)
if (-not $drift) {{ exit 0 }}
$drift | ForEach-Object {{ Write-Host "sshd: $_" }}

$apply = @"
`$ErrorActionPreference = 'Stop'
if ((Get-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0').State -ne 'Installed') {{
    Add-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0' | Out-Null
}}
Set-Service sshd -StartupType Automatic
Start-Service sshd
New-Item HKLM:\SOFTWARE\OpenSSH -Force -ErrorAction Ignore | Out-Null
New-ItemProperty HKLM:\SOFTWARE\OpenSSH -Name DefaultShell -PropertyType String -Value '$($shell -replace "'", "''")' -Force | Out-Null
"@
if ($syncKeys) {{
    $apply += "`n" + @"
Copy-Item -LiteralPath '$($keys -replace "'", "''")' -Destination '$($adminKeys -replace "'", "''")' -Force
icacls '$($adminKeys -replace "'", "''")' /inheritance:r /grant '*S-1-5-32-544:F' /grant '*S-1-5-18:F' | Out-Null
"@
}}
$encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($apply))
Start-Process $shell -Verb RunAs -Wait -ArgumentList '-NoProfile', '-EncodedCommand', $encoded

$drift = @(Get-Drift)
if ($drift) {{ throw "sshd is still not set up: $($drift -join '; ')" }}
'''] },
]

# The claude, codex and opencode CLIs, each from its own install script so it
# can update itself in userspace. A CLI already installed is left to its own
# updater. Run by the agent-clis hooks in .krypt.toml on `krypt setup` and
# `krypt update`.
#
# claude and codex land in ~/.local/bin (codex as a symlink into its release,
# editing a shell profile only when that dir is not on PATH). opencode's
# installer and self-update always write ~/.opencode/bin, whatever its README
# says about OPENCODE_INSTALL_DIR and XDG_BIN_DIR, and the fish and PowerShell
# configs put that dir on PATH; --no-modify-path keeps the installer out of the
# krypt-managed fish config. It also skips when the opencode found on PATH is
# already the latest, which the check after it catches.
[[command]]
group       = "system"
name        = "agents"
description = "Install the claude, codex and opencode CLIs"
platform    = ["linux", "macos"]
steps = [
    { if = "!file_exists:${LOCAL_BIN}/claude", run = ["bash", "-c", "curl -fsSL https://claude.ai/install.sh | bash"] },
    { if = "!file_exists:${LOCAL_BIN}/codex", run = ["bash", "-c", "curl -fsSL https://chatgpt.com/codex/install.sh | PATH=\"$HOME/.local/bin:$PATH\" CODEX_NON_INTERACTIVE=1 sh"] },
    { if = "!file_exists:${HOME}/.opencode/bin/opencode", run = ["bash", "-c", "curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path; test -x \"$HOME/.opencode/bin/opencode\" || {{ echo \"opencode is not in ~/.opencode/bin: its installer skips when $(command -v opencode) is already the latest; remove that one\" >&2; exit 1; }}"] },
]

# Windows: claude installs ~/.local/bin/claude.exe itself. codex's installer
# makes its bin dir a junction to the current release, so it must keep its own
# dir, and ~/.local/bin gets a scoop shim for it rather than a symlink: a shim
# starts the real exe at its real path, which codex needs to find the
# codex-resources and codex-path dirs beside its release (checked on Windows 11
# with codex 0.158.0). opencode goes to ~/.opencode/bin as above.
#
# opencode's installer is a bash script; `bash` on PATH is the WSL launcher, so
# it runs under Git's bash. opencode's self-update runs bare `bash` too, and so
# never reaches this install, which is why the installer runs on every call
# here: it exits early when the installed version is the latest.
[[command]]
group       = "system"
name        = "agents"
description = "Install the claude, codex and opencode CLIs"
platform    = "windows"
steps = [
    { if = "!file_exists:${LOCAL_BIN}/claude.exe", run = ["pwsh", "-NoProfile", "-Command", "irm https://claude.ai/install.ps1 | iex"] },
    { if = "!file_exists:${WIN_LOCALAPPDATA}/Programs/OpenAI/Codex/bin/codex.exe", run = ["pwsh", "-NoProfile", "-Command", "$env:CODEX_NON_INTERACTIVE = '1'; irm https://chatgpt.com/codex/install.ps1 | iex"] },
    { run = ["pwsh", "-NoProfile", "-Command", '''$ErrorActionPreference = 'Stop'; $shim = Join-Path (scoop prefix scoop) 'supporting\shims\kiennq\shim.exe'; $bin = Join-Path $HOME '.local\bin'; $target = Join-Path $env:LOCALAPPDATA 'Programs\OpenAI\Codex\bin\codex.exe'; if (-not (Test-Path $target)) {{ throw "codex is not at $($target)" }}; $exe = Join-Path $bin 'codex.exe'; if (-not (Test-Path $exe)) {{ Copy-Item $shim $exe }}; Set-Content (Join-Path $bin 'codex.shim') "path = `"$target`""'''] },
    { run = ["pwsh", "-NoProfile", "-Command", '''$ErrorActionPreference = 'Stop'; $bash = Join-Path (git --exec-path) '..\..\..\bin\bash.exe'; if (-not (Test-Path $bash)) {{ throw "Git's bash is not at $bash" }}; & $bash -c 'curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path'; if ($LASTEXITCODE) {{ exit $LASTEXITCODE }}; $target = Join-Path $HOME '.opencode\bin\opencode.exe'; if (-not (Test-Path $target)) {{ throw "opencode is not at $($target): its installer skips when the opencode on PATH is already the latest; remove that one" }}'''] },
]

# The Arch system configs in .root/ (pacman, mkinitcpio and its UKI preset,
# logind, sleep, ly, kanata, the power-profile timer and udev rule), copied
# into / with the services they belong to enabled. The script refuses to run
# outside Arch, or without the ESP at /boot that the UKI preset needs. Run by
# the root-configs hook in .krypt.toml on `krypt setup`; rerun it by hand
# after .root/ changes.
#
# The script runs from krypt's clone, not ~/.local/bin: `krypt setup` runs
# its hooks before the first `krypt link`. That is the clone's default path;
# a repo placed elsewhere with `krypt init --repo-path` has to run its own
# copy of .local/bin/.root-configs.
[[command]]
group       = "system"
name        = "root"
description = "Install the Arch configs in .root/ and enable their services (requires root)"
platform    = "linux"
steps = [
    { run = ["krypt", "deps", "--group", "root"] },
    { run = ["bash", "${XDG_CONFIG}/krypt/repo/.local/bin/.root-configs"] },
]

[[command]]
group       = "system"
name        = "notify-test"
description = "Fire a suite of test notifications"
platform    = "linux"
steps = [
    { run = ["bash", "${HOME}/.local/bin/.notify-test"], ignore_failure = true },
]

