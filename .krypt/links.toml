dst = "${XDG_CONFIG}/opencode/"

# --- LLM agents ---
#
# One source per file, deployed to every agent that reads it; the repo holds no
# symlinks, which Git for Windows checks out as text files holding the target
# path. ~/.claude-work is a second Claude Code config dir (CLAUDE_CONFIG_DIR in
# the fish and PowerShell configs) sharing the same rules and settings.
[[link]]
src = ".config/agents/AGENTS.md"
dst = "${XDG_CONFIG}/opencode/AGENTS.md"

[[link]]
src = ".config/agents/AGENTS.md"
dst = "${HOME}/.claude/CLAUDE.md"

[[link]]
src = ".config/agents/AGENTS.md"
dst = "${HOME}/.claude-work/CLAUDE.md"

[[link]]
src = ".config/agents/AGENTS.md"
dst = "${HOME}/.codex/AGENTS.md"

# settings.json runs the statusline as `bash ~/.claude/statusline-command.sh`
# from both config dirs, so one copy serves both; on Windows `bash` is Git
# Bash's, and the script needs jq (the core group).
[[link]]
src = ".claude/settings.json"
dst = "${HOME}/.claude/settings.json"

[[link]]
src = ".claude/settings.json"
dst = "${HOME}/.claude-work/settings.json"

[[link]]
src = ".claude/statusline-command.sh"
dst = "${HOME}/.claude/statusline-command.sh"

# --- Windows Terminal ---
# Only settings.json: the state.json beside it is runtime state Terminal writes
# itself (generated profiles, a hash of the settings).
[[link]]
src = "AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json"
dst = "${WIN_LOCALAPPDATA}/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json"
platform = "windows"

# --- PowerShell ---

[[link]]
src = "Documents/PowerShell/Microsoft.PowerShell_profile.ps1"
dst = "${DOCUMENTS}/PowerShell/Microsoft.PowerShell_profile.ps1"
platform = "windows"

