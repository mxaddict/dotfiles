# A real file rather than a git symlink: Git for Windows checks symlinks out as
# text files holding the target path.
[[link]]
src = ".config/agents/AGENTS.md"
dst = "${XDG_CONFIG}/opencode/AGENTS.md"

# --- PowerShell ---

[[link]]
src = "Documents/PowerShell/Microsoft.PowerShell_profile.ps1"
dst = "${DOCUMENTS}/PowerShell/Microsoft.PowerShell_profile.ps1"
platform = "windows"

# --- .local/bin utility + menu scripts ---
