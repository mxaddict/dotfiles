# Links — deploy files / dirs from the repo into $HOME
# Included by .krypt.toml
#
# Tools that read ~/.config on every OS share one entry. Tools that read a
# native folder on Windows get a second `platform = "windows"` entry with the
# same source; Windows-only files live under AppData/ and Documents/, mirroring
# where they land.

# --- Root dotfiles ---
[[link]]
src = ".gitconfig"
dst = "${HOME}/.gitconfig"

[[link]]
src = ".gtkrc-2.0"
dst = "${HOME}/.gtkrc-2.0"
platform = "linux"

[[link]]
src = ".clang-format"
dst = "${HOME}/.clang-format"

[[link]]
src = ".editorconfig"
dst = "${HOME}/.editorconfig"

[[link]]
src = ".prettierrc"
dst = "${HOME}/.prettierrc"

[[link]]
src = ".prettierignore"
dst = "${HOME}/.prettierignore"

# --- .config subdirs (glob per subdir) ---
#
# Entries gated to ["linux", "macos"] have a native-folder counterpart on
# Windows (or no Windows use at all), so the ~/.config copy is not deployed
# where nothing reads it.

# Alacritty: one shared config and an entry point per platform that imports it
# and sets the shell (fish on Linux and macOS, PowerShell 7 on Windows).
[[link]]
src = ".config/alacritty/common.toml"
dst = "${XDG_CONFIG}/alacritty/common.toml"

[[link]]
src = ".config/alacritty/alacritty.toml"
dst = "${XDG_CONFIG}/alacritty/alacritty.toml"
platform = "linux"

[[link]]
src = ".config/alacritty/macos.toml"
dst = "${XDG_CONFIG}/alacritty/alacritty.toml"
platform = "macos"

# Alacritty on Windows ignores ~/.config.
[[link]]
src = "AppData/Roaming/alacritty/alacritty.toml"
dst = "${WIN_APPDATA}/alacritty/alacritty.toml"
platform = "windows"

[[link]]
src_glob = ".config/bat/**/*"
dst = "${XDG_CONFIG}/bat/"
platform = ["linux", "macos"]

[[link]]
src_glob = ".config/bat/**/*"
dst = "${WIN_APPDATA}/bat/"
platform = "windows"

[[link]]
src_glob = ".config/bluetui/**/*"
dst = "${XDG_CONFIG}/bluetui/"
platform = "linux"

[[link]]
src_glob = ".config/cargo/**/*"
dst = "${XDG_CONFIG}/cargo/"

[[link]]
src_glob = ".config/dconf/**/*"
dst = "${XDG_CONFIG}/dconf/"
platform = "linux"

[[link]]
src_glob = ".config/fish/**/*"
dst = "${XDG_CONFIG}/fish/"
platform = ["linux", "macos"]

[[link]]
src_glob = ".config/gh/**/*"
dst = "${XDG_CONFIG}/gh/"
platform = ["linux", "macos"]

[[link]]
src_glob = ".config/gh/**/*"
dst = "${WIN_APPDATA}/GitHub CLI/"
platform = "windows"

[[link]]
src_glob = ".config/gtk-3.0/**/*"
dst = "${XDG_CONFIG}/gtk-3.0/"
platform = "linux"

[[link]]
src_glob = ".config/gtk-4.0/**/*"
dst = "${XDG_CONFIG}/gtk-4.0/"
platform = "linux"

