# Dependency groups — cross-distro package mappings.
# Included by .krypt.toml
#
# TODO: paru bootstrap — the bash deps script cloned the AUR paru repo and ran
# makepkg before any paru -S calls.  This imperative step has no declarative
# equivalent in krypt yet.  Until krypt gains a pre-deps hook phase, bootstrap
# paru manually on a fresh Arch install:
#   sudo pacman -S base-devel rustup git --needed --noconfirm
#   rustup default stable
#   git clone https://aur.archlinux.org/paru.git /tmp/paru && cd /tmp/paru
#   makepkg -si --noconfirm
# After that `krypt deps` will use paru for subsequent installs.

[[deps]]
group = "core"
pacman = [
    "alacritty", "bat", "btop", "curl", "eza", "fastfetch", "fd", "fish",
    "fzf", "git", "jq", "neovim", "ripgrep", "starship", "stow", "tealdeer",
    "tmux", "unzip", "wget", "zoxide",
]
apt = [
    "alacritty", "bat", "btop", "curl", "eza", "fastfetch", "fd-find", "fish",
    "fzf", "git", "jq", "neovim", "ripgrep", "starship", "stow", "tealdeer",
    "tmux", "unzip", "wget", "zoxide",
]
dnf = [
    "alacritty", "bat", "btop", "cargo:starship", "curl", "eza", "fastfetch",
    "fd-find", "fish", "fzf", "git", "jq", "neovim", "ripgrep", "stow",
    "tealdeer", "tmux", "unzip", "wget", "zoxide",
]
# Homebrew disabled its alacritty cask on 2026-09-01 (fails Gatekeeper); see
# docs/backlog.md.
brew = [
    "bat", "btop", "eza", "fastfetch", "fd", "fish", "fzf", "git", "jq",
    "neovim", "ripgrep", "starship", "stow", "tealdeer", "tmux", "unzip", "wget",
    "zoxide",
]
# Windows uses scoop: per-user installs under ~/scoop, no UAC prompt. krypt adds
# the buckets `bucket/app` entries name before installing a group.
scoop = [
    "bat", "btop", "extras/alacritty", "extras/psfzf", "eza", "fastfetch", "fd",
    "fzf", "git", "jq", "neovim", "pwsh", "ripgrep", "starship", "tealdeer",
    "uutils-coreutils", "zoxide",
]

[[deps]]
group = "dev"
pacman = [
    "bear", "doctl", "github-cli", "glab", "lazygit", "nodejs", "npm",
    "opencode", "python-tldextract", "rustup",
]
apt = [
    "bear", "gh", "glab", "lazygit", "libssl-dev", "nodejs", "npm", "pkg-config",
    "python3", "python3-venv", "rustup",
]
dnf = [
    "bear", "doctl", "gh", "glab", "nodejs", "npm", "python3", "rustup",
]
brew = [
    "bear", "doctl", "gh", "glab", "lazygit", "node", "opencode", "rustup",
]
scoop = [
    "doctl", "gh", "glab", "lazygit", "nodejs-lts", "opencode", "rustup",
]

[[deps]]
group = "fonts"
pacman = [
    "gnu-free-fonts", "gsfonts", "noto-fonts-cjk", "noto-fonts-emoji",
    "terminus-font", "ttf-hack", "ttf-hack-nerd", "ttf-noto-nerd", "ttf-roboto",
    "ttf-roboto-mono", "ttf-roboto-mono-nerd", "woff2-font-awesome",
]
apt = []
dnf = []
brew = ["font-hack-nerd-font"]
# The Mono variant is the "Hack Nerd Font Mono" family Alacritty asks for.
scoop = ["nerd-fonts/Hack-NF-Mono"]

[[deps]]
group = "hyprland"
required_platforms = ["linux"]
pacman = [
    "brightnessctl", "dex", "grim", "hypridle", "hyprland", "hyprlock",
    "hyprpaper", "hyprpicker", "hyprpolkitagent", "hyprqt6engine",
    "libnotify", "nwg-displays", "nwg-look", "qt5-wayland",
    "qt6-wayland", "slurp", "swaync", "swayosd", "waybar", "wl-clipboard",
    "wtype", "xdg-desktop-portal-gtk", "xdg-desktop-portal-hyprland",
]
apt = [
    "libnotify-bin",
]
dnf = [
    "libnotify",
]
brew = []

[[deps]]
group = "media"
pacman = [
    "ardour", "alsa-firmware", "alsa-utils", "gst-libav", "gst-plugin-va",
    "gst-plugins-bad", "gst-plugins-base", "gst-plugins-good",
    "gst-plugins-ugly", "imv", "kooha", "mpv", "pipewire", "pipewire-alsa",
    "pipewire-jack", "pipewire-pulse", "snapshot", "sof-firmware", "wiremix",
    "wireplumber", "yt-dlp",
]
apt = ["mpv", "yt-dlp"]
dnf = ["mpv", "yt-dlp"]
brew = ["mpv", "yt-dlp"]
# Windows plays media with its own player, so no mpv there.
scoop = ["yt-dlp"]

[[deps]]
group = "system"
required_platforms = ["linux"]
pacman = [
    "avahi", "bind", "bluez", "bluez-utils", "bluetui", "cronie", "cups",
    "cups-pdf", "ethtool", "fprintd", "fwupd", "ghostscript", "kanata", "ly",
    "man-db", "mtr", "networkmanager", "nmap", "nss-mdns", "power-profiles-daemon",
    "reflector", "rsync", "sbctl", "speedtest-cli", "traceroute", "ufw",
    "usbutils", "wireless-regdb", "zerotier-one",
]
apt = []
dnf = []
brew = []

[[deps]]
group = "apps"
pacman = [
    "adw-gtk-theme", "breeze", "chromium", "cmatrix", "duf", "dysk", "firefox",
    "libadwaita", "nautilus", "papirus-icon-theme", "pass", "pass-otp",
    "pass-secret-service", "qalculate-qt", "thunderbird", "vieb-bin",
]
apt = ["duf", "dysk"]
dnf = ["cargo:dysk", "duf", "firefox", "thunderbird"]
brew = ["duf", "dysk", "firefox", "thunderbird"]
scoop = ["duf", "extras/firefox", "extras/thunderbird"]

# kryptic-sh tools. Arch uses the AUR -bin packages (via paru), macOS the
# kryptic-sh Homebrew tap and Windows the kryptic-sh scoop bucket. Other systems
# build the ones published on crates.io with cargo, which needs a default Rust
# toolchain (the dev group's rustup). pikr, buffr, inbx, hodl and krypt publish
# no crate or distro repository, and gemini-cli is an npm package; see
# docs/backlog.md.
[[deps]]
group = "kryptic"
pacman = [
    "buffr-bin", "gemini-cli", "gpur-bin", "hjkl-bin", "hodl-bin", "hrdr-bin",
    "inbx-bin", "krypt-bin", "pikr-bin", "sqeel-bin",
]
apt = ["cargo:gpur", "cargo:hjkl", "cargo:hrdr", "cargo:sqeel"]
dnf = ["cargo:gpur", "cargo:hjkl", "cargo:hrdr", "cargo:sqeel"]
brew = [
    "gemini-cli", "kryptic-sh/tap/buffr", "kryptic-sh/tap/gpur",
    "kryptic-sh/tap/hjkl", "kryptic-sh/tap/hodl", "kryptic-sh/tap/hrdr",
    "kryptic-sh/tap/inbx", "kryptic-sh/tap/krypt", "kryptic-sh/tap/pikr",
    "kryptic-sh/tap/sqeel",
]
scoop = [
    "kryptic-sh/buffr", "kryptic-sh/gpur", "kryptic-sh/hrdr", "kryptic-sh/krypt",
    "kryptic-sh/pikr", "cargo:hjkl", "cargo:sqeel",
]
scoop_buckets = { kryptic-sh = "https://github.com/kryptic-sh/scoop-bucket" }
