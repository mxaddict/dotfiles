name: setup

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
          rustflags: ''

      - uses: ./.github/actions/krypt

      - name: Deploy and verify
        run: ./.github/scripts/test-setup.ps1

  # `krypt system root` on Arch: the root deps group through paru as a non-root
  # user (kanata is AUR-only), then .root/ copied into / and its services
  # enabled. Arch only, because .root/ holds Arch configs.
  root:
    name: root (arch)
    runs-on: ubuntu-latest
    # ufw loads its rules into the kernel when enabled, which needs NET_ADMIN.
    container:
      image: archlinux:latest
      options: --cap-add=NET_ADMIN
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare pacman
        run: pacman -Syu --noconfirm --needed base-devel git sudo

      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/krypt
        with:
          cache-key: arch

      - name: Install the root configs and verify
        run: ./.github/scripts/test-root.sh
