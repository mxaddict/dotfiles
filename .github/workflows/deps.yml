name: deps

# Package names drift as distros and catalogs publish releases, independent of
# any change here, so this runs weekly as well as on changes, and stays apart
# from the setup workflow so a renamed package cannot mask a deploy regression.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  deps:
    name: deps (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arch
            os: ubuntu-latest
            container: archlinux:latest
            prepare: pacman -Syu --noconfirm --needed base-devel git
          - name: debian
            os: ubuntu-latest
            container: debian:stable
            prepare:
              apt-get update && apt-get install -y --no-install-recommends
              build-essential ca-certificates curl git
          - name: ubuntu
            os: ubuntu-latest
            container: ubuntu:latest
            prepare:
              apt-get update && apt-get install -y --no-install-recommends
              build-essential ca-certificates curl git
          - name: fedora
            os: ubuntu-latest
            container: fedora:latest
            prepare: dnf install -y gcc git
          - name: macos
            os: macos-latest
            container: ''
          - name: windows
            os: windows-latest
            container: ''
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare the package manager
        if: matrix.prepare
        run: ${{ matrix.prepare }}

      - uses: actions/checkout@v5

      # cargo builds krypt and backs the `cargo:` entries; the macOS and
      # Windows runners ship it, the distro images do not.
      - name: Install Rust
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - uses: ./.github/actions/krypt
        with:
          cache-key: ${{ matrix.name }}

      # The Windows groups install through scoop, which the runner does not
      # ship. The runner's user is an administrator, which scoop's installer
      # refuses without -RunAsAdmin.
      - name: Install scoop
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          Join-Path $env:USERPROFILE 'scoop\shims' >> $env:GITHUB_PATH

      # Homebrew skips formulae from untrusted taps; trusting the kryptic-sh
      # tap is the same one-time step the README gives for a Mac.
      - name: Trust the kryptic-sh Homebrew tap
        if: matrix.name == 'macos'
        run: brew trust --tap kryptic-sh/tap

      - name: Every package resolves on this system
        run: krypt deps --config .krypt.toml --check

      - name: Install the core group
        run: krypt deps --config .krypt.toml --group core

      - name: A second run finds core installed
        run: |
          out=$(krypt deps --config .krypt.toml --group core)
          echo "$out"
          if echo "$out" | grep -q '^installed:'; then
            echo "::error::the second run installed core packages again"
            exit 1
          fi
          echo "$out" | grep -q '^already installed: ' ||
            { echo "::error::the second run reported nothing installed"; exit 1; }

      # scoop puts coreutils.exe on PATH as a shim in its shared shims folder;
      # the profile must alias the real coreutils folder, not every shim.
      - name: The profile aliases scoop's coreutils, not its shims
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          . ./Documents/PowerShell/Microsoft.PowerShell_profile.ps1
          # sort: the profile replaces ls and cat with eza and bat.
          $sort = (Get-Alias sort).Definition
          $sort
          if ($sort -notlike '*\apps\uutils-coreutils\*\sort.exe') { throw "sort aliases $sort" }
          if (Get-Alias git -ErrorAction Ignore) { throw 'a non-coreutils shim was aliased' }

      # links.toml deploys tealdeer's config to ~/.config on macOS, as on
      # Linux; ask the tealdeer that core installed where it actually reads it.
      - name: tealdeer reads its config where macOS links it
        if: matrix.name == 'macos'
        run: |
          paths=$(tldr --show-paths)
          echo "$paths"
          echo "$paths" | grep -q "Config path: *$HOME/.config/tealdeer/config.toml" ||
            { echo "::error::tealdeer does not read ~/.config/tealdeer/config.toml"; exit 1; }

      # lazygit (dev group, not installed above) is linked to Application
      # Support on macOS per its docs; ask lazygit itself.
      - name: lazygit reads its config where macOS links it
        if: matrix.name == 'macos'
        run: |
          brew install lazygit
          dir=$(lazygit --print-config-dir)
          echo "$dir"
          [ "$dir" = "$HOME/Library/Application Support/lazygit" ] ||
            { echo "::error::lazygit reads $dir, not Library/Application Support/lazygit"; exit 1; }
