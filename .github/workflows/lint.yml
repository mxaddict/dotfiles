name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          shopt -s nullglob
          # Third-party scripts we ship as-is — don't lint upstream.
          skip=(".local/bin/grimblast")
          is_skipped() {
            local f="$1"
            for s in "${skip[@]}"; do [ "$f" = "$s" ] && return 0; done
            return 1
          }
          fail=0
          for f in .local/bin/.* .local/bin/*; do
            [ -f "$f" ] || continue
            [ -x "$f" ] || continue
            is_skipped "$f" && { echo "== skip (upstream) $f =="; continue; }
            head -n1 "$f" | grep -qE '^#!.*(bash|sh)\b' || continue
            echo "== shellcheck $f =="
            shellcheck -x "$f" || fail=1
          done
          exit "$fail"

  prettier:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install prettier
        run: npm install --global prettier@3
      - name: Check formatting
        run: |
          prettier --check \
            --no-error-on-unmatched-pattern \
            --ignore-path .gitignore \
            --ignore-path .prettierignore \
            "**/*.md" \
            "**/*.json" \
            "**/*.jsonc" \
            "**/*.yml" \
            "**/*.yaml" \
            "**/*.ts" \
            "**/*.tsx" \
            "**/*.js" \
            "**/*.jsx"

  validate-configs:
    name: validate JSON / TOML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The runner image ships jq and a Python with tomllib (3.11+).
      - name: Validate JSON files
        run: |
          fail=0
          while IFS= read -r f; do
            # git ls-files may list paths not present on disk (symlinks,
            # ignored content). Skip if missing.
            [ -f "$f" ] || { echo "== skip (missing) $f =="; continue; }
            echo "== json $f =="
            jq empty "$f" || fail=1
          done < <(git ls-files '*.json')
          exit "$fail"
      # JSONC (.jsonc) is parsed by the prettier job — no separate step here.
      - name: Validate TOML files
        run: |
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || { echo "== skip (missing) $f =="; continue; }
            echo "== toml $f =="
            python3 -c "import sys, tomllib; tomllib.load(open(sys.argv[1], 'rb'))" "$f" || fail=1
          done < <(git ls-files '*.toml')
          exit "$fail"

  fish:
    name: fish syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Check fish syntax
        run: |
          fail=0
          count=0
          while IFS= read -r f; do
            echo "== fish $f =="
            count=$((count + 1))
            fish --no-execute "$f" || fail=1
          done < <(git ls-files '*.fish')
          [ "$count" -gt 0 ] || { echo "no .fish files found"; exit 1; }
          exit "$fail"

  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stylua
        env:
          STYLUA_VERSION: 2.4.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/stylua.zip" \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v$STYLUA_VERSION/stylua-linux-x86_64.zip"
          unzip -q "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/stylua"
          echo "$RUNNER_TEMP/stylua" >> "$GITHUB_PATH"
      # Neovim's Lua takes its style from .config/nvim/stylua.toml, the rest
      # from .editorconfig.
      - name: Check Lua formatting
        run: |
          mapfile -t files < <(git ls-files '*.lua')
          [ "${#files[@]}" -gt 0 ] || { echo "no .lua files found"; exit 1; }
          stylua --check "${files[@]}"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " $tarball\$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Also runs shellcheck over each `run:` script; the runner image has it.
      - name: Check workflows
        run: actionlint

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Install PSScriptAnalyzer
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
      - name: Analyze PowerShell scripts
        run: |
          $ErrorActionPreference = 'Stop'
          # Prove the analyzer reports at this severity before trusting a
          # clean result: a script with a syntax error must be flagged.
          $probe = Join-Path $env:RUNNER_TEMP 'probe.ps1'
          Set-Content -LiteralPath $probe -Value 'function Broken {'
          if (-not (Invoke-ScriptAnalyzer -Path $probe -Severity ParseError, Error)) {
            throw 'PSScriptAnalyzer flagged nothing in a script with a syntax error'
          }

          $files = @(git ls-files '*.ps1')
          if ($files.Count -eq 0) { throw 'no .ps1 files found' }
          $findings = @($files | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Severity ParseError, Error
          })
          $findings | Format-Table -AutoSize ScriptName, Line, RuleName, Message | Out-String -Width 200
          Write-Host "analyzed $($files.Count) files, $($findings.Count) findings"
          if ($findings.Count) { exit 1 }
