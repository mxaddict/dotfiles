# paru — AUR helper.
#
# This file REPLACES /etc/paru.conf rather than extending it: paru reads the
# first config it finds out of $PARU_CONF, $XDG_CONFIG_HOME/paru/paru.conf,
# ~/.config/paru/paru.conf and /etc/paru.conf, and stops there. So Include the
# system config first to keep the options the paru package enables (PgpFetch,
# Devel, Provides, DevelSuffixes), then add ours. Without that Include they are
# all silently off. The path is safe to require: only paru reads this file, and
# the paru package owns /etc/paru.conf, so one cannot be present without the
# other. paru's Include takes a literal path and errors if it is missing — it
# accepts no glob, so there is no optional form.
Include = /etc/paru.conf

# RemoveMake and CleanAfter are commented out in the shipped /etc/paru.conf.
# Without them every AUR build leaves its makedepends installed as dependencies
# nothing requires, and leaves its clone and build tree in ~/.cache/paru. The
# Arch machine had collected 59 such orphans (~940 MiB) by 2026-11-01 — meson,
# vala, appstream-glib, python-sphinx, scdoc and the rest of the makedepend sets
# of builds that finished months ago.
[options]
RemoveMake
CleanAfter
