# paru — AUR helper. Read in addition to /etc/paru.conf, which paru ships with
# most options commented out.
#
# RemoveMake and CleanAfter are the two that matter here: without them every
# AUR build leaves its makedepends installed as dependencies nothing requires,
# and leaves its clone and build products in ~/.cache/paru. On this machine
# that had accumulated 59 orphaned packages (~940 MiB) by 2026-11-01 —
# meson, vala, appstream-glib, python-sphinx, scdoc and the rest of the
# makedepend sets of builds that finished months ago.

[options]
RemoveMake
CleanAfter
