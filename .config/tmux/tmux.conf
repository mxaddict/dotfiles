set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -ag terminal-features "*:extkeys"
set -g mouse on
set -s extended-keys always
set -as terminal-features 'alacritty*:extkeys'
set -g allow-passthrough on

# Carry Wayland session env into tmux panes on attach. tmux-sensible only
# bumps the X11/SSH-related vars; without this, panes inside long-running
# sessions inherit empty WAYLAND_DISPLAY and Wayland-native apps (floem,
# wgpu via vk_wayland, etc.) fall back to XWayland.
set -ga update-environment ' WAYLAND_DISPLAY XDG_SESSION_TYPE XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR'

# Give binds a note (`bind -N`): `krypt menu keys` lists them with it

# Vim style pane selection
bind -N "Focus pane left" h select-pane -L
bind -N "Focus pane down" j select-pane -D
bind -N "Focus pane up" k select-pane -U
bind -N "Focus pane right" l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 0
set -g pane-base-index 0
set-window-option -g pane-base-index 0
set-option -g renumber-windows on

# Shift Alt vim keys to switch windows
bind -N "Previous window" -n M-h previous-window
bind -N "Next window" -n M-l next-window

# Catppuccin settings
set -g @catppuccin_flavor "mocha" # latte, frappe, macchiato or mocha
set -g @catppuccin_status_left_separator  "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_window_current_text    " #W"
set -g @catppuccin_window_status_style    "basic"
set -g @catppuccin_window_text            " #W"

# Load our plugins
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|fzf|sqeel|hjkl)(diff)?(-wrapped)?'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'

# Status
set -g  status-left ""
set -g status-right "#{E:@catppuccin_status_session}#{E:@catppuccin_status_host}"

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -N "Start selection" -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -N "Copy selection" -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open vertical split
bind -N "Split pane top/bottom in current dir" "'" split-window -v -c "#{pane_current_path}"
bind -N "Split pane top/bottom in current dir" '"' split-window -v -c "#{pane_current_path}"

# Open horizontal split
bind -N "Split pane left/right in current dir" ';' split-window -h -c "#{pane_current_path}"
bind -N "Split pane left/right in current dir" '%' split-window -h -c "#{pane_current_path}"

# New window
bind -N "New window in current dir" 'c' new-window      -c "#{pane_current_path}"

# Sync input
bind -N "Toggle synchronized input to all panes" 'x' set-window-option synchronize-panes

# Run tpm
run '~/.config/tmux/plugins/tpm/tpm'

# Give the plugins' binds notes too
run '~/.config/tmux/plugin-notes.sh'
